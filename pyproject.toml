[project]
name = "resume_generator"
version = "0.1.0"
description = "Helps write resume based on your knowledge base"
authors = [
    {name = "Beniamin Deszert-Kłosowski", email = "beniamin.deszert123@gmail.com"}
]
readme = "README.md"
requires-python = "3.12.9"
dependencies = [
    "pytest (>=9.1.1,<10.0.0)",
    "langchain (>=1.3.14,<2.0.0)",
    "langgraph (>=1.2.9,<2.0.0)",
    "lmstudio (>=1.5.0,<2.0.0)",
    "google-genai (>=2.13.0,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "langchain-google-genai (>=4.3.2,<5.0.0)",
    "langchain-text-splitters (>=1.1.2,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
extraPaths = ["."]

[tool.poetry.scripts]
main = "resume_generator.application.main:main"
compile = "resume_generator.application.compile:main"
